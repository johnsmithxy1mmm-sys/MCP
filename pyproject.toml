[project]
name = "predmarket-mcp"
version = "0.1.0"
description = "Monetizable remote MCP server serving prediction-market intelligence (Polymarket, Kalshi)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.3.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Postgres metering backend (production). SQLite (stdlib) is the zero-infra default.
postgres = ["asyncpg>=0.29"]
# Semantic matcher tier (MATCHER=semantic|hybrid). Local ONNX bge embeddings,
# CPU-only, no torch. First use downloads weights from Hugging Face once.
semantic = ["fastembed>=0.4"]
# Live Kalshi private endpoints (orderbook) need RSA-PSS request signing.
kalshi = ["cryptography>=42"]
# Shared state across instances (x402 replay guard + rate limiter) for horizontal
# scaling. Without it the server runs single-instance on local SQLite/memory.
redis = ["redis>=5.0"]
# Real on-chain anchoring of the track-record Merkle root (EIP-1559 signing).
# Without it, anchoring uses the deterministic MockChainAnchor.
anchor = ["eth-account>=0.11"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "cryptography>=42",  # for Kalshi signing tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predmarket_mcp", "core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
